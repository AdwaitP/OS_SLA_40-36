<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Scheduling Simulator: Priority</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Light slate background */
        }
        
        /* Custom scrollbar for Gantt chart container */
        .gantt-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .gantt-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .gantt-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .gantt-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Hover effect for Gantt blocks */
        .gantt-block {
            transition: filter 0.2s;
        }
        .gantt-block:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen p-4 md:p-8">

    <!-- Header Section -->
    <header class="max-w-7xl mx-auto mb-8 bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-8 rounded-2xl shadow-xl text-center relative overflow-hidden">
        <!-- Background aesthetic shapes -->
        <div class="absolute top-0 left-0 w-64 h-64 bg-white opacity-5 rounded-full -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-0 w-80 h-80 bg-white opacity-5 rounded-full translate-x-1/3 translate-y-1/3"></div>
        
        <h1 class="text-3xl md:text-4xl font-bold mb-3 relative z-10">Process Scheduling Simulator</h1>
        <p class="text-blue-200 text-sm md:text-lg font-medium relative z-10">Comparing Preemptive, Non-preemptive & Deferred Algorithms</p>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto flex flex-col gap-8">
        
        <!-- TOP ROW: Inputs and Queue -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Add Process Form Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-1 flex flex-col">
                <h2 class="text-xl font-semibold mb-4 text-slate-800 border-b border-slate-100 pb-3">Add Process</h2>
                
                <!-- Custom Message Box for Errors -->
                <div id="msg-box" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

                <div class="space-y-4 flex-grow">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Process ID</label>
                            <input type="text" id="pid" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none bg-slate-50" readonly>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Arrival Time</label>
                            <input type="number" id="at" min="0" value="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Burst Time</label>
                            <input type="number" id="bt" min="1" value="5" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" title="Lower number = Higher priority">Priority (Low=High)</label>
                            <input type="number" id="prio" min="1" value="1" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    
                    <div class="flex gap-3 pt-4">
                        <button onclick="addProcess()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors shadow-sm text-sm">
                            Add
                        </button>
                        <button onclick="clearAll()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg transition-colors text-sm border border-slate-200">
                            Clear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Process Queue Table Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h2 class="text-lg font-semibold text-slate-800">Process Queue</h2>
                    <div class="flex items-center gap-3">
                        <label class="text-sm font-semibold text-slate-600">Global Preemption Interval:</label>
                        <input type="number" id="global-interval" min="1" value="2" class="w-20 border border-slate-300 rounded text-center px-2 py-1 focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex-grow overflow-y-auto max-h-[250px]">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-100 sticky top-0 text-slate-500 text-xs uppercase">
                            <tr>
                                <th class="px-4 py-3 font-semibold">ID</th>
                                <th class="px-4 py-3 font-semibold">Arrival Time</th>
                                <th class="px-4 py-3 font-semibold">Burst Time</th>
                                <th class="px-4 py-3 font-semibold">Priority</th>
                                <th class="px-4 py-3 font-semibold text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="process-table-body" class="divide-y divide-slate-100">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Simulation Control -->
        <section class="flex justify-center -my-2 relative z-20">
            <button onclick="runSimulation()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-12 rounded-full shadow-lg shadow-emerald-600/30 transition-transform active:scale-95 text-lg flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Run Comparison Simulation
            </button>
        </section>

        <!-- OUTPUT SECTION: 3 Stacked Results -->
        <section id="output-section" class="hidden flex-col gap-6 mb-12">
            
            <!-- Result Container: Pure Preemptive -->
            <div id="res-preemptive" class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500"></div>
            
            <!-- Result Container: Non-Preemptive -->
            <div id="res-non-preemptive" class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500"></div>
            
            <!-- Result Container: Deferred -->
            <div id="res-deferred" class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500"></div>

        </section>
    </main>

    <script>
        // Data Structures
        let processes = [
            // Default scenario designed to highlight context switch differences
            { id: 'P1', at: 0, bt: 7, prio: 3 },
            { id: 'P2', at: 1, bt: 3, prio: 2 },
            { id: 'P3', at: 2, bt: 2, prio: 1 },
            { id: 'P4', at: 4, bt: 2, prio: 4 }
        ];
        let processCounter = 5;
        
        // Predefined vivid palette for Gantt chart processes
        const processColors = [
            '#3B82F6', // Blue
            '#10B981', // Emerald
            '#F59E0B', // Amber
            '#8B5CF6', // Violet
            '#EC4899', // Pink
            '#14B8A6', // Teal
            '#F97316', // Orange
            '#06B6D4', // Cyan
            '#84CC16', // Lime
            '#EF4444'  // Red
        ];

        // Initialize UI
        document.addEventListener('DOMContentLoaded', () => {
            updatePidField();
            renderQueueTable(); // Render defaults
        });

        // Show custom message (replaces alert)
        function showMessage(msg, type = 'error') {
            const box = document.getElementById('msg-box');
            box.textContent = msg;
            box.className = `mb-4 p-3 rounded-lg text-sm font-medium ${type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-600 border border-green-200'}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        // Set the PID input to next sequential ID
        function updatePidField() {
            document.getElementById('pid').value = 'P' + processCounter;
        }

        // Add Process to array and UI
        function addProcess() {
            const id = document.getElementById('pid').value;
            const at = parseInt(document.getElementById('at').value, 10);
            const bt = parseInt(document.getElementById('bt').value, 10);
            const prio = parseInt(document.getElementById('prio').value, 10);

            // Validation
            if (isNaN(at) || at < 0) return showMessage('Arrival Time must be >= 0');
            if (isNaN(bt) || bt <= 0) return showMessage('Burst Time must be > 0');
            if (isNaN(prio) || prio < 0) return showMessage('Priority must be >= 0');

            processes.push({ id, at, bt, prio });
            processCounter++;
            updatePidField();
            renderQueueTable();
        }

        // Remove a single process
        function removeProcess(index) {
            processes.splice(index, 1);
            renderQueueTable();
        }

        // Clear all data
        function clearAll() {
            processes = [];
            processCounter = 1;
            updatePidField();
            renderQueueTable();
            document.getElementById('output-section').style.display = 'none';
        }

        // Render the Input Queue Table
        function renderQueueTable() {
            const tbody = document.getElementById('process-table-body');
            if (processes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-slate-400 italic">No processes added yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = processes.map((p, idx) => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-3 font-medium text-slate-800">${p.id}</td>
                    <td class="px-4 py-3">${p.at}</td>
                    <td class="px-4 py-3">${p.bt}</td>
                    <td class="px-4 py-3 font-semibold text-indigo-600">${p.prio}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="removeProcess(${idx})" class="text-red-500 hover:text-red-700 font-semibold text-xs bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition-colors">
                            Del
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Generate consistent color based on ID
        function getColorForId(id) {
            if (id === 'IDLE') return '#cbd5e1'; // slate-300
            
            // Simple hash function to deterministically assign color
            let hash = 0;
            for (let i = 0; i < id.length; i++) {
                hash = id.charCodeAt(i) + ((hash << 5) - hash);
            }
            return processColors[Math.abs(hash) % processColors.length];
        }

        // Main Simulation Wrapper
        function runSimulation() {
            if (processes.length === 0) {
                return showMessage('Please add at least one process to run the simulation.');
            }

            const interval = parseInt(document.getElementById('global-interval').value, 10);
            if (isNaN(interval) || interval <= 0) return showMessage('Global Preemption Interval must be > 0');

            // Run all three algorithms and render their output
            const preemptiveResult = simulateLogic('preemptive', processes, interval);
            renderAlgorithmResult('res-preemptive', 'Pure Preemptive Priority', 'red', preemptiveResult, "High responsiveness, but suffers from very high context switch overhead.");

            const nonPreemptiveResult = simulateLogic('non-preemptive', processes, interval);
            renderAlgorithmResult('res-non-preemptive', 'Non-Preemptive Priority', 'blue', nonPreemptiveResult, "Zero preemption overhead, but critical high-priority tasks may be blocked for too long.");

            const deferredResult = simulateLogic('deferred', processes, interval);
            renderAlgorithmResult('res-deferred', 'Deferred Preemption (Hybrid)', 'emerald', deferredResult, "The Sweet Spot: Limits context switches while still responding to critical tasks at predictable boundaries.");

            document.getElementById('output-section').style.display = 'flex';
            setTimeout(() => { document.getElementById('output-section').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }

        // Core Tick-by-Tick Simulation Logic
        function simulateLogic(algo, originalProcs, interval) {
            let procs = originalProcs.map(p => ({ ...p, rt: p.bt, completed: false, ct: 0 }));
            
            let t = 0;
            let completedCount = 0;
            let timeline = [];
            let runningId = null;
            let contextSwitches = 0;
            let lastRunningId = null;

            while (completedCount < procs.length) {
                let arrived = procs.filter(p => p.at <= t && !p.completed);

                if (arrived.length === 0) {
                    timeline.push("IDLE");
                    runningId = "IDLE";
                    t++;
                    continue;
                }

                arrived.sort((a, b) => {
                    if (a.prio !== b.prio) return a.prio - b.prio;
                    if (a.at !== b.at) return a.at - b.at;
                    return a.id.localeCompare(b.id);
                });

                let bestCandidate = arrived[0];

                // Algorithm Logic for selecting the process to run this tick
                if (algo === 'non-preemptive') {
                    if (!runningId || runningId === "IDLE") runningId = bestCandidate.id;
                } 
                else if (algo === 'preemptive') {
                    runningId = bestCandidate.id;
                } 
                else if (algo === 'deferred') {
                    if (!runningId || runningId === "IDLE") {
                        runningId = bestCandidate.id;
                    } else {
                        // Check if we reached a safe boundary point based on global clock
                        if (t % interval === 0) {
                            let runningProc = procs.find(p => p.id === runningId);
                            // Preempt if a strictly higher priority task is available
                            if (bestCandidate.prio < runningProc.prio) {
                                runningId = bestCandidate.id;
                            }
                        }
                    }
                }

                // Track context switches (ignoring idle transitions)
                if (runningId !== lastRunningId && lastRunningId !== null && lastRunningId !== "IDLE" && runningId !== "IDLE") {
                    contextSwitches++;
                }
                lastRunningId = runningId;

                // Execute the chosen process
                timeline.push(runningId);
                let execProc = procs.find(p => p.id === runningId);
                
                execProc.rt--;
                t++; // Advance time clock

                // Handle completion
                if (execProc.rt === 0) {
                    execProc.completed = true;
                    execProc.ct = t;
                    completedCount++;
                    runningId = null; // Forces picking a new process next tick
                }
            }

            // Calculate Metrics
            let totalTAT = 0, totalWT = 0;
            procs.forEach(p => {
                p.tat = p.ct - p.at;
                p.wt = p.tat - p.bt;
                totalTAT += p.tat;
                totalWT += p.wt;
            });

            // Compress Timeline to Gantt Blocks
            let gantt = [];
            let currentBlock = { id: timeline[0], start: 0, end: 1 };
            for (let i = 1; i < timeline.length; i++) {
                if (timeline[i] === currentBlock.id) {
                    currentBlock.end = i + 1;
                } else {
                    gantt.push(currentBlock);
                    currentBlock = { id: timeline[i], start: i, end: i + 1 };
                }
            }
            gantt.push(currentBlock);

            return { gantt, procs, avgTAT: totalTAT/procs.length, avgWT: totalWT/procs.length, contextSwitches };
        }

        // Render Individual Algorithm Result HTML
        function renderAlgorithmResult(containerId, title, colorTheme, data, description) {
            const container = document.getElementById(containerId);
            const tColor = `text-${colorTheme}-700`;
            const bgColor = `bg-${colorTheme}-50`;
            const borderColor = `border-${colorTheme}-200`;

            const totalTime = data.gantt[data.gantt.length - 1].end;
            const minWidthPx = Math.max(600, totalTime * 30);

            // Build Gantt
            let ganttHtml = `<div class="relative h-12 rounded-lg bg-slate-100 border border-slate-200 shadow-inner overflow-hidden" style="width: 100%; min-width: ${minWidthPx}px;">`;
            data.gantt.forEach(block => {
                const left = (block.start / totalTime) * 100;
                const width = ((block.end - block.start) / totalTime) * 100;
                const bg = getColorForId(block.id);
                const txt = block.id === 'IDLE' ? 'text-slate-600' : 'text-white';
                ganttHtml += `<div class="gantt-block absolute top-0 bottom-0 flex items-center justify-center font-bold text-xs sm:text-sm border-r border-black/10 ${txt}" style="left: ${left}%; width: ${width}%; background-color: ${bg};">${block.id}</div>`;
            });
            ganttHtml += `</div><div class="relative h-6 mt-1 text-xs font-semibold text-slate-500" style="width: 100%; min-width: ${minWidthPx}px;">`;
            ganttHtml += `<div class="absolute top-0 transform -translate-x-1/2" style="left: 0%;">0</div>`;
            data.gantt.forEach(block => {
                const left = (block.end / totalTime) * 100;
                ganttHtml += `<div class="absolute top-0 transform -translate-x-1/2" style="left: ${left}%;">${block.end}</div>`;
            });
            ganttHtml += `</div>`;

            container.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold ${tColor}">${title}</h2>
                        <p class="text-sm text-slate-600 mt-1 italic">${description}</p>
                    </div>
                    <div class="flex gap-4">
                        <div class="text-center px-4 py-2 ${bgColor} border ${borderColor} rounded-lg">
                            <div class="text-xs uppercase tracking-wide font-bold text-slate-500 mb-1">Avg WT</div>
                            <div class="text-lg font-bold text-slate-800">${data.avgWT.toFixed(2)}</div>
                        </div>
                        <div class="text-center px-4 py-2 ${bgColor} border ${borderColor} rounded-lg">
                            <div class="text-xs uppercase tracking-wide font-bold text-slate-500 mb-1">Avg TAT</div>
                            <div class="text-lg font-bold text-slate-800">${data.avgTAT.toFixed(2)}</div>
                        </div>
                        <div class="text-center px-4 py-2 ${colorTheme === 'emerald' ? 'bg-emerald-100 border-emerald-300' : (colorTheme === 'red' ? 'bg-red-100 border-red-300' : 'bg-slate-100 border-slate-300')} border rounded-lg shadow-sm">
                            <div class="text-xs uppercase tracking-wide font-extrabold text-slate-700 mb-1">Context Switches</div>
                            <div class="text-2xl font-black ${colorTheme === 'emerald' ? 'text-emerald-700' : 'text-slate-900'}">${data.contextSwitches}</div>
                        </div>
                    </div>
                </div>
                
                <div class="gantt-scroll overflow-x-auto pb-4">
                    <div class="relative mt-2">
                        ${ganttHtml}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
